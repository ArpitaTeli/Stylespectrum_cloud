
version: 0.2

phases:

  install:
    runtime-versions:
      python: 3.11
    commands:
      - python3 --version
      - python3 -m pip install --upgrade pip
      - python3 -m pip install -r Backend/requirements.txt

  pre_build:
    commands:
      - echo "Preparing StyleSpectrum backend..."
      - ls -la Backend/
      - test -f Backend/app.py
      - test -f Backend/requirements.txt
      - test -f appspec.yml
      - test -f scripts/install_dependencies.sh
      - test -f scripts/start_server.sh
      - test -f scripts/stop_server.sh
      - test -f Backend/Datasets/color_palate_ds.xlsx
      - test -f Backend/Datasets/suggestions.xlsx
      - chmod +x scripts/*.sh

  build:
    commands:
      - echo "Validating Python files..."
      - python3 -m compileall -q Backend
      - PYTHONPATH=Backend python3 -c "import model; assert model.palette_data is not None and model.suggestions is not None"
      - echo "StyleSpectrum build completed!"

  post_build:
    commands:
      - echo "Preparing deployment artifacts..."
      - echo "Ready for CodeDeploy!"

artifacts:
  files:
    - appspec.yml
    - scripts/**/*
    - Backend/**/*

  exclude-paths:
    - "Backend/.env"
    - "Backend/**/.env"
    - "Backend/venv/**/*"
    - "Backend/**/venv/**/*"
    - "Backend/__pycache__/**/*"
    - "Backend/**/__pycache__/**/*"
    - "Backend/uploads/**/*"

  discard-paths: no
