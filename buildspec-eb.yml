version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - python3 --version
      - python3 -m pip install --upgrade pip
      - python3 -m pip install -r Backend/requirements.txt

  pre_build:
    commands:
      - test -f Procfile
      - test -f requirements.txt
      - test -f Backend/app.py
      - test -f Backend/Datasets/color_palate_ds.xlsx
      - test -f Backend/Datasets/suggestions.xlsx

  build:
    commands:
      - python3 -m compileall -q Backend
      - PYTHONPATH=Backend python3 -c "import model; assert model.palette_data is not None and model.suggestions is not None"

artifacts:
  files:
    - Procfile
    - requirements.txt
    - Backend/**/*
  exclude-paths:
    - "Backend/.env"
    - "Backend/**/.env"
    - "Backend/**/.env.*"
    - "Backend/venv/**/*"
    - "Backend/**/venv/**/*"
    - "Backend/__pycache__/**/*"
    - "Backend/**/__pycache__/**/*"
    - "Backend/uploads/**/*"
  discard-paths: no
