
version: 0.0
os: linux

files:
  - source: Backend/
    destination: /var/www/stylespectrum
    file_exists_behavior: OVERWRITE

hooks:
  AfterInstall:
    - location: scripts/install_dependencies.sh
      timeout: 300
      runas: root

  ApplicationStop:
    - location: scripts/stop_server.sh
      timeout: 60
      runas: root

  ApplicationStart:
    - location: scripts/start_server.sh
      timeout: 60
      runas: root